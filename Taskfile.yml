# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - task --list-all
    silent: true

  serve:
    cmds:
      - hugo serve {{.CLI_ARGS}}
  build:
    cmds:
      - hugo build {{.CLI_ARGS}}
  go:build:all:
    cmds:
      - go build -o top-blogs scripts/top-blogs.go
      - go build -o fetch-zet scripts/fetch-zet.go
      - go build -o create-post scripts/create-post.go
  go:build:*:
    desc: Build Go binary
    vars:
      ARG_1: "{{index .MATCH 0}}"
    cmds:
      - go build -o {{.ARG_1}} scripts/{{.ARG_1}}.go
  post:
    desc: Create a new post
    cmds:
      - ./create-post {{.CLI_ARGS}}
  pdf:pages:
    desc: Render each page of a PDF to WebP for the pdf shortcode
    cmds:
      - |
        set -euo pipefail
        pdf="{{.CLI_ARGS}}"
        base="${pdf%.pdf}"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        rm -f "$base"-*.webp
        pdftoppm -png -scale-to-x 1600 -scale-to-y -1 "$pdf" "$tmp/p"
        for png in "$tmp"/p-*.png; do
          n=${png##*/p-}
          magick "$png" -define webp:lossless=true "$base-${n%.png}.webp"
        done
